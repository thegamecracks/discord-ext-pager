name: Lint with Ruff

on:
  push:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
